{{- /*
  Expandable box that explains a term, so the text itself stays short.
  Closed by default; works without JavaScript and with the keyboard.
  Usage: {{< info "Was ist ein NUC?" >}}Explanation in Markdown{{< /info >}}
*/ -}}
<details class="info-box">
  <summary><span class="info-box-icon" aria-hidden="true">i</span>{{ .Get 0 }}</summary>
  <div class="info-box-content">
    {{ .Inner | .Page.RenderString (dict "display" "block") }}
  </div>
</details>
