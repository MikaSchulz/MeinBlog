{{ with .GetTerms "categories" }}
<div class="post-categories">
    <strong id="post-categories-label">{{ i18n "categories" }}:</strong>
    <ul class="category-list" aria-labelledby="post-categories-label">
        {{ range . }}
        <li class="category"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
        {{ end }}
    </ul>
</div>
{{ end }}

{{ with .GetTerms "tags" }}
<div class="post-tags">
    <strong id="post-tags-label">{{ i18n "tags" }}:</strong>
    <ul class="tag-list" aria-labelledby="post-tags-label">
        {{ range . }}
        <li class="tag"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
        {{ end }}
    </ul>
</div>
{{ end }}
