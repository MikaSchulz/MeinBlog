<li class="post-item">
    <article>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        {{ partial "post-date.html" . }}
        {{ with .Description }}
        <p>{{ . }}</p>
        {{ else }}
        {{ with .Summary | plainify | truncate 200 }}
        <p>{{ . }}</p>
        {{ end }}
        {{ end }}
        <a href="{{ .RelPermalink }}" aria-label="{{ i18n "readMoreAbout" (dict "Title" .Title) }}">
            {{ i18n "readMore" }} →
        </a>
    </article>
</li>
