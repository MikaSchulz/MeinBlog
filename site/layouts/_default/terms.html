{{ define "main" }}
<section aria-labelledby="taxonomy-title">
    <h1 id="taxonomy-title">{{ .Title }}</h1>

    <ul class="taxonomy-list" role="list">
        {{ range .Pages }}
        {{ $count := len (where .Pages ".Draft" false) }}
        <li class="taxonomy-item">
            <h2>
                <a href="{{ .RelPermalink }}">
                    {{ .Title }}
                </a>
            </h2>
            <span class="count">
                ({{ i18n "postCount" $count }})
            </span>
        </li>
        {{ end }}
    </ul>
</section>
{{ end }}
