{{ define "main" }}
<article class="about-page" role="article" aria-labelledby="about-title">
    <h1 id="about-title">{{ .Title }}</h1>

    {{ with .Params.image }}
    {{- $size := imageConfig (path.Join "static" .) }}
    <img src="{{ . | relURL }}" alt="{{ $.Params.imageAlt | default "Author profile photo" }}" class="author-image" width="{{ $size.Width }}" height="{{ $size.Height }}">
    {{ end }}

    <div class="content">
        {{ .Content }}
    </div>
</article>
{{ end }}
