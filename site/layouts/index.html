{{ define "main" }}

<section class="hero-section">
    <div class="hero-content">
        <div class="hero-text">
            {{ .Content }}
        </div>
        {{ with .Params.image }}
        <div class="hero-image">
            <img src="{{ . | relURL }}" alt="{{ $.Params.imageAlt | default site.Params.author }}" />
        </div>
        {{ end }}
    </div>
</section>

<section aria-labelledby="recent-posts-heading">
    <h2 id="recent-posts-heading">{{ i18n "recentPosts" }}</h2>

    {{ partial "post-list.html" (where .Site.RegularPages "Type" "posts") }}
</section>

{{ end }}
